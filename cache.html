<!doctype html>
<html lang="es" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guardando caché</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: #00ff9f;
      font-family: system-ui, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      max-width: 400px;
      width: 90%;
    }
    h1 { margin: 0 0 20px; font-size: 1.4rem; }
    #msg { margin-bottom: 16px; min-height: 1.4em; }
    .track {
      height: 10px;
      background: #222;
      border-radius: 5px;
      overflow: hidden;
      margin: 12px 0;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: #00ff9f;
      transition: width 0.2s;
    }
    #pct { font-size: 1.2rem; font-weight: bold; }
    a { color: #00ff9f; }
  </style>
</head>
<body>
  <div class="box">
    <h1>NanospeedGamer</h1>
    <p id="msg">Guardando caché...</p>
    <div class="track"><div id="bar"></div></div>
    <p id="pct">0%</p>
    <p><a href="index.html">Ir a la página principal</a></p>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const app = window.applicationCache;

    function update(text, value) {
      msg.textContent = text;
      if (typeof value === "number") {
        bar.style.width = value + "%";
        pct.textContent = value + "%";
      }
    }

    if (!app) {
      update("Este navegador no soporta caché offline.", null);
    } else {
      app.addEventListener("checking", () => update("Comprobando caché...", 0));
      app.addEventListener("downloading", () => update("Guardando caché...", 0));
      app.addEventListener("progress", e => {
        if (e.lengthComputable && e.total > 0) {
          update("Guardando caché...", Math.round(e.loaded / e.total * 100));
        } else {
          update("Descargando archivos...", null);
        }
      });
      app.addEventListener("cached", () => update("Caché guardado correctamente.", 100));
      app.addEventListener("noupdate", () => update("El caché ya está actualizado.", 100));
      app.addEventListener("updateready", () => {
        try { app.swapCache(); } catch(e) {}
        update("Caché actualizado.", 100);
      });
      app.addEventListener("error", () => update("Error al guardar el caché.", null));
    }
  </script>
</body>
</html>
